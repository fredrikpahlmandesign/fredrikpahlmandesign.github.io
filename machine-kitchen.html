<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Machine Kitchen, build a food factory</title>
<meta name="description" content="A browser game about assembling kitchen machines. Lay belts, bolt on slicers, fryers and mixers, and serve the order.">
<meta name="theme-color" content="#0e1216">
<meta property="og:title" content="Machine Kitchen">
<meta property="og:description" content="Build a kitchen assembly line, serve the order, buy better machines.">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --steel-900:#0e1216;
  --steel-850:#141a20;
  --steel-800:#1a222a;
  --steel-700:#232e38;
  --steel-600:#2f3d49;
  --steel-400:#5d7285;
  --steel-300:#93a7b7;
  --cream:#f2efe6;
  --flame:#ff8a1f;
  --flame-dim:#a5541a;
  --pilot:#3ec9c0;
  --warn:#e0464b;
  --r:10px;
  --tick:520ms;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--steel-900);color:var(--cream);
  font-family:"IBM Plex Sans",system-ui,sans-serif;overscroll-behavior:none}
body{
  background-image:radial-gradient(circle at 1px 1px,rgba(255,255,255,.035) 1px,transparent 0);
  background-size:14px 14px;
}
.app{max-width:520px;margin:0 auto;padding:10px 12px 28px;display:flex;flex-direction:column;gap:10px}
.backlink{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--steel-400);text-decoration:none;padding:2px 0}
.backlink:hover{color:var(--flame)}

/* ---------- control panel header ---------- */
.panel{
  background:linear-gradient(180deg,var(--steel-800),var(--steel-850));
  border:1px solid var(--steel-600);border-radius:var(--r);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.06);
}
header.hdr{display:flex;align-items:center;gap:8px;padding:9px 11px}
.brand{font-family:Archivo,system-ui,sans-serif;font-weight:800;font-size:15px;letter-spacing:.02em;
  line-height:1;text-transform:uppercase}
.brand span{color:var(--flame)}
.spacer{flex:1}
.readout{font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:13px;
  background:#0a0e11;border:1px solid var(--steel-600);border-radius:6px;padding:5px 8px;
  color:var(--flame);box-shadow:inset 0 0 12px rgba(255,138,31,.14)}
.iconbtn{background:var(--steel-700);border:1px solid var(--steel-600);color:var(--cream);
  border-radius:8px;padding:6px 9px;font-size:12px;font-weight:600;font-family:inherit;cursor:pointer}
.iconbtn:active{transform:translateY(1px)}
.iconbtn:focus-visible,button:focus-visible{outline:2px solid var(--pilot);outline-offset:2px}

/* ---------- order ticket ---------- */
.ticket{padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.ticket .row{display:flex;align-items:center;gap:10px}
.eyebrow{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--steel-400)}
.lvname{font-family:Archivo,sans-serif;font-weight:800;font-size:17px;line-height:1.1}
.target{display:flex;align-items:center;gap:7px;margin-left:auto}
.chip{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;font-size:19px;
  border:1px solid rgba(0,0,0,.35);box-shadow:inset 0 -6px 10px rgba(0,0,0,.22)}
.count{font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:15px}
.count b{color:var(--pilot)}
.bar{height:5px;background:#0a0e11;border-radius:3px;overflow:hidden;border:1px solid var(--steel-700)}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--flame-dim),var(--flame));width:0;
  transition:width .3s ease}
.chain{display:flex;flex-wrap:wrap;align-items:center;gap:4px;font-size:11px;color:var(--steel-300)}
.chain .m{background:var(--steel-700);border-radius:6px;padding:2px 6px}
.chain .arw{color:var(--steel-400)}

/* ---------- board ---------- */
.board{position:relative;padding:9px;border-radius:var(--r);
  background:
    repeating-linear-gradient(90deg,rgba(255,255,255,.02) 0 1px,transparent 1px 9px),
    linear-gradient(180deg,#1b232b,#131a20);
  border:1px solid var(--steel-600);
  box-shadow:0 10px 24px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.05)}
.cells{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:3px;width:100%}
.cell{aspect-ratio:1;border-radius:7px;background:#10161b;border:1px solid #1e2830;
  position:relative;display:grid;place-items:center;cursor:pointer;min-width:0;min-height:0;
  font-size:var(--cg,17px);transition:background .12s,border-color .12s}
.cell:active{border-color:var(--flame)}
.cell.filled{background:linear-gradient(180deg,#293743,#1e2a33);border-color:#38495a}
.cell.belt{background:linear-gradient(180deg,#1a232b,#141c22)}
.cell.locked{background:linear-gradient(180deg,#2a2118,#191b20);border-color:#4a3a25}
.cell .glyph{line-height:1;filter:drop-shadow(0 1px 1px rgba(0,0,0,.5))}
.cell .arw{position:absolute;font-size:calc(var(--cg,17px)*.55);color:var(--flame);opacity:.85;line-height:1}
.cell.hot{animation:hot .9s ease-in-out infinite}
@keyframes hot{0%,100%{box-shadow:inset 0 0 0 0 rgba(255,138,31,0)}50%{box-shadow:inset 0 0 14px 1px rgba(255,138,31,.45)}}
.cell .buf{position:absolute;bottom:3px;display:flex;gap:2px}
.cell .buf i{width:4px;height:4px;flex:0 0 auto;border-radius:50%;background:var(--pilot)}
.itemlayer{position:absolute;inset:0;pointer-events:none}
.food{position:absolute;left:0;top:0;width:var(--fw,26px);height:var(--fw,26px);
  margin:calc(var(--fw,26px) / -2) 0 0 calc(var(--fw,26px) / -2);border-radius:calc(var(--fw,26px)*.3);
  display:grid;place-items:center;font-size:calc(var(--fw,26px)*.58);border:1px solid rgba(0,0,0,.4);
  box-shadow:0 2px 6px rgba(0,0,0,.5);transition:transform var(--tick) linear;will-change:transform;z-index:2}
.food.busy{animation:wob .5s ease-in-out infinite}
@keyframes wob{0%,100%{filter:brightness(1)}50%{filter:brightness(1.5)}}
.pop{position:absolute;font-family:"IBM Plex Mono",monospace;font-size:12px;font-weight:600;
  color:var(--pilot);animation:pop .7s ease-out forwards;pointer-events:none;z-index:5}
@keyframes pop{to{transform:translateY(-26px);opacity:0}}

/* ---------- parts tray ---------- */
.tray{padding:9px 9px 10px}
.parts{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.parts::-webkit-scrollbar{display:none}
.part{flex:0 0 auto;width:56px;padding:7px 3px 5px;border-radius:9px;background:var(--steel-800);
  border:1px solid var(--steel-600);cursor:pointer;text-align:center;font-family:inherit;color:var(--cream)}
.part.on{background:linear-gradient(180deg,#3a2a15,#2a1e10);border-color:var(--flame);
  box-shadow:0 0 0 1px rgba(255,138,31,.35)}
.part.lockd{opacity:.42}
.part .pe{font-size:19px;line-height:1.15}
.part .pn{font-size:9px;color:var(--steel-300);margin-top:2px;line-height:1.15}
.part .pp{font-family:"IBM Plex Mono",monospace;font-size:9px;color:var(--flame)}

.dirrow{display:flex;align-items:center;gap:6px;margin-top:9px}
.dirlbl{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.12em;color:var(--steel-400);
  text-transform:uppercase}
.dirs{display:flex;gap:5px;margin-left:auto}
.dir{width:34px;height:30px;border-radius:8px;background:var(--steel-800);border:1px solid var(--steel-600);
  color:var(--steel-300);font-size:14px;cursor:pointer;display:grid;place-items:center;font-family:inherit}
.dir.on{background:var(--steel-700);border-color:var(--pilot);color:var(--pilot)}

.ctrls{display:flex;gap:7px}
.btn{flex:1;padding:11px 8px;border-radius:var(--r);border:1px solid var(--steel-600);
  background:var(--steel-800);color:var(--cream);font-family:Archivo,sans-serif;font-weight:600;
  font-size:13px;letter-spacing:.02em;cursor:pointer;text-transform:uppercase}
.btn.go{background:linear-gradient(180deg,#ff9a34,#e0700c);border-color:#ffab55;color:#1a1206}
.btn.stop{background:linear-gradient(180deg,#31424f,#233039)}
.btn:active{transform:translateY(1px)}

/* ---------- modals ---------- */
.scrim{position:fixed;inset:0;background:rgba(6,9,11,.78);display:none;align-items:center;
  justify-content:center;padding:16px;z-index:40;backdrop-filter:blur(3px)}
.scrim.open{display:flex}
.sheet{width:100%;max-width:440px;max-height:86vh;overflow:auto;padding:15px;
  background:linear-gradient(180deg,var(--steel-800),var(--steel-850));
  border:1px solid var(--steel-600);border-radius:14px;box-shadow:0 20px 50px rgba(0,0,0,.6)}
.sheet h2{font-family:Archivo,sans-serif;font-weight:800;font-size:18px;margin:0 0 3px;text-transform:uppercase}
.sheet p.sub{margin:0 0 12px;font-size:12px;color:var(--steel-300)}
.item{display:flex;gap:10px;align-items:center;padding:9px;border-radius:10px;background:var(--steel-850);
  border:1px solid var(--steel-700);margin-bottom:7px}
.item .ie{font-size:22px;width:30px;text-align:center}
.item .it{flex:1;min-width:0}
.item .it b{font-size:13px;display:block}
.item .it small{font-size:11px;color:var(--steel-300);display:block;line-height:1.35}
.buy{padding:7px 10px;border-radius:8px;border:1px solid var(--flame);background:var(--flame);
  color:#1a1206;font-weight:700;font-size:12px;font-family:"IBM Plex Mono",monospace;cursor:pointer}
.buy[disabled]{background:transparent;color:var(--steel-400);border-color:var(--steel-600);cursor:default}
.owned{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--pilot)}
.lvitem{cursor:pointer}
.lvitem.lock{opacity:.45;cursor:default}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#0a0e11;
  border:1px solid var(--steel-600);color:var(--cream);padding:9px 14px;border-radius:20px;font-size:12px;
  z-index:60;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.show{opacity:1}
.win .big{font-family:Archivo,sans-serif;font-weight:800;font-size:26px;text-transform:uppercase;
  color:var(--flame);text-align:center;margin:4px 0}
.win .stat{text-align:center;font-family:"IBM Plex Mono",monospace;font-size:13px;color:var(--steel-300);
  margin-bottom:12px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.cell.helpmark{outline:3px dashed var(--flame);outline-offset:-3px}.helpgrid{width:100%;table-layout:fixed;border-collapse:separate;border-spacing:3px;margin:12px 0}.helpgrid td{background:#10161b;border:1px solid #38495a;height:42px;text-align:center;font-size:18px}.helpgrid th{font-size:11px;color:#93a7b7}.helpgrid small{display:block;color:#ff8a1f;font-size:13px}.helpgrid caption{text-align:left;font-size:12px;margin-bottom:8px;color:#93a7b7}

.cells .pixel-art{pointer-events:none}
.cells{touch-action:none;user-select:none;-webkit-user-select:none}
.cell:focus-visible{outline:2px solid var(--pilot);outline-offset:-2px}
.workshop-tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.workshop-tools .btn{font-size:12px;padding:9px 12px;flex:1}
.workshop-tools p{margin:0;font-size:11px;color:#98adba;line-height:1.5;width:100%}
.inspect-title{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.inspect-title>div{min-width:0;padding-top:2px}
.inspect-close{flex:0 0 40px;width:40px;height:40px;display:grid;place-items:center;padding:0;border-radius:50%;border:1px solid var(--steel-600);background:var(--steel-700);color:var(--cream);font-family:inherit;font-size:22px;line-height:1;cursor:pointer}
.inspect-close:hover{background:var(--steel-600);border-color:var(--steel-300)}
.inspect-close:active{transform:scale(.95)}
.inspect-title h2{margin:0}.inspect-title .sub{margin:0 0 5px}
.machine-portrait{margin:16px auto;border:1px solid #42505c;border-radius:16px;background:#151e26;max-width:300px;overflow:hidden}
.machine-portrait.animated{position:relative;isolation:isolate}
.machine-portrait.animated>.machine-art{animation:machine-idle 1.8s steps(2,end) infinite;transform-origin:50% 88%}
.machine-portrait.thermal::after{content:'';position:absolute;inset:45% 12% 12%;pointer-events:none;background:radial-gradient(ellipse,#ff9a3422,transparent 70%);mix-blend-mode:screen;animation:heat-shimmer 2.8s ease-in-out infinite}
.machine-steam{position:absolute;inset:0;pointer-events:none;z-index:1}
.machine-steam i{position:absolute;left:38%;top:37%;width:5%;height:12%;background:linear-gradient(0deg,transparent,#dcecf299,transparent);filter:blur(3px);opacity:0;animation:machine-steam 3.6s ease-out infinite}
.machine-steam i:nth-child(2){left:52%;top:35%;animation-delay:1.2s}
.machine-steam i:nth-child(3){left:63%;top:38%;animation-delay:2.4s}
@keyframes machine-idle{0%,100%{transform:translateY(0)}50%{transform:translateY(-1px)}}
@keyframes heat-shimmer{0%,100%{opacity:.25}50%{opacity:.9}}
@keyframes machine-steam{0%{opacity:0;transform:translate(0,0) scale(.8)}20%{opacity:.45}100%{opacity:0;transform:translate(8px,-56px) scale(1.7)}}
@media(prefers-reduced-motion:reduce){.machine-steam{display:none}.machine-portrait.thermal::after{opacity:.25}}
.pixel-art{display:block;background-repeat:no-repeat;image-rendering:pixelated;text-align:center;font-size:48px}
.machine-art{width:100%;aspect-ratio:1;background-size:400% 400%}
.food-art{width:76px;aspect-ratio:1;background-size:600% 800%;border-radius:10px}

.art-recipe{display:flex;flex-direction:column;align-items:center;gap:8px;border:1px solid #35444f;border-radius:12px;padding:12px;margin:12px 0;background:#141c23}
.recipe-inputs{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:8px}
.ingredient{display:flex;flex-direction:column;align-items:center;gap:5px;text-align:center;font-size:11px;max-width:100px;color:#e7e5db}
.recipe-arrow{color:#72d0c6;font-size:22px}
.shop-art{width:76px;flex:0 0 76px;overflow:hidden;border-radius:10px;background:#151e26}
.inspect-link{border:1px solid #536b78;border-radius:7px;background:#22333e;color:#9de0d6;padding:6px 9px;margin-top:8px;cursor:pointer;font:inherit;font-size:12px;text-align:left}
@media(max-width:400px){.shop-art{width:54px;flex-basis:54px}}

/* Pixel-art on the production floor */
.app{max-width:680px}
header.hdr{flex-wrap:wrap;padding:12px 14px;gap:10px}
.brand{flex:1;min-width:140px}
.pixel-logo{display:block;width:168px;height:auto;overflow:visible}
.logo-light{animation:pilot-glow 4s steps(2,end) infinite}
.logo-belt{animation:belt-hum 3s steps(2,end) infinite;transform-origin:center}
@keyframes pilot-glow{0%,80%,100%{opacity:1}85%,95%{opacity:.4}}
@keyframes belt-hum{0%,100%{transform:translateY(0)}50%{transform:translateY(.3px)}}
.cell .machine-art{width:100%;height:100%;border-radius:6px;clip-path:inset(4% 2%)}
.cell .food-art{width:82%;height:82%;border-radius:4px}
.cell .arw{z-index:3;background:#0e1216;border:1px solid #6b562e;border-radius:3px;padding:1px;font-size:11px;opacity:1}
.cell .buf{z-index:4;background:#10161be6;border-radius:4px;padding:2px;bottom:2px}
.food .food-art{width:100%;height:100%;border-radius:4px}
.art-ready .food{background:transparent!important;border:0;box-shadow:0 2px 4px #0008;border-radius:4px}
.chip{width:58px;height:58px;overflow:hidden;border-radius:8px}
.chip .food-art{width:100%;height:100%}
.part{width:76px;padding:4px 4px 7px}
.part .pe{width:64px;height:64px;display:grid;place-items:center;margin:auto}
.part .machine-art{width:64px;height:64px;border-radius:5px}
.part .pn{font-size:10px;min-height:23px;display:grid;place-items:center;color:var(--cream)}
.part.lockd{opacity:.62}
.part .pp{font-size:10px}
.chain .m{display:inline-flex;align-items:center;gap:4px;padding:3px 5px}
.chain .pixel-art{width:27px;height:27px;flex:0 0 27px;border-radius:3px;font-size:18px}
.item .ie .food-art{width:48px;height:48px}
.lvitem .ie{width:48px;flex:0 0 48px}
@media(max-width:420px){
 header.hdr{gap:8px;padding:10px}.brand{flex-basis:calc(100% - 90px)}
 .pixel-logo{width:150px}.hdr .spacer{display:none}.hdr .iconbtn{flex:1}
 .part{width:70px}.part .pe,.part .machine-art{width:58px;height:58px}
 .chip{width:48px;height:48px}.lvname{font-size:16px}
}


/* Original illustrated logo, with a quiet furnace glow. */
.hdr .brand-art{flex:0 0 100%;min-width:0;display:flex;justify-content:center}
.logo-machine{position:relative;width:min(100%,480px);line-height:0;isolation:isolate}
.machine-logo{display:block;width:100%;height:auto;image-rendering:pixelated;animation:logo-engine-idle 4s steps(2,end) infinite}
.logo-furnace{position:absolute;left:9.4%;top:45%;width:4.4%;height:13%;border-radius:25%;background:radial-gradient(ellipse,#ffd26977,#ff8a1f22 55%,transparent 75%);mix-blend-mode:screen;pointer-events:none;animation:logo-furnace-glow 3.2s ease-in-out infinite}
@keyframes logo-engine-idle{0%,100%{transform:translateY(0)}50%{transform:translateY(-1px)}}
@keyframes logo-furnace-glow{0%,100%{opacity:.2}45%{opacity:.85}60%{opacity:.55}}
@media(max-width:420px){.hdr .brand-art{flex-basis:100%}.hdr .readout{margin-right:auto}.hdr .iconbtn{flex:0 0 auto;padding:8px 12px}}
@media(prefers-reduced-motion:reduce){.logo-furnace{opacity:.25}}


/* Mechanical layers use clipped copies of the supplied artwork. */
.logo-mechanisms{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none;image-rendering:pixelated}
.logo-wheel{animation:logo-wheel-turn 18s linear infinite;transform-box:view-box}
.logo-roller{animation:logo-wheel-turn 3.8s linear infinite;transform-box:view-box}
.logo-pump{transform-box:view-box;animation:logo-box-pump 5.3s ease-in-out infinite}
.logo-pump-1{animation-duration:6.1s;animation-delay:-4.8s}
.logo-pump-2{animation-duration:4.7s;animation-delay:-3.2s}
.logo-pump-3{animation-duration:6.7s;animation-delay:-2.1s}
.logo-belt-roll{animation:logo-belt-travel 1.8s linear infinite}.logo-belt-return{animation:logo-belt-travel 1.8s linear infinite reverse}
.logo-puff{opacity:0;animation:logo-pipe-puff 13s steps(10,end) infinite}
.logo-puff-1{animation-delay:.45s}.logo-puff-2{animation-delay:1s}
@keyframes logo-wheel-turn{to{transform:rotate(360deg)}}
@keyframes logo-box-pump{0%,12%,44%,68%,100%{transform:scale(1)}20%{transform:scale(1.025,1.065)}29%{transform:scale(1.008,1.015)}35%{transform:scale(1.018,1.04)}}
@keyframes logo-belt-travel{to{transform:translateX(64px)}}
@keyframes logo-pipe-puff{0%,64%,88%,100%{opacity:0;transform:translate(0,0) scale(1)}66%{opacity:.32}78%{opacity:.15}87%{opacity:0;transform:translate(-65px,-95px) scale(1.35)}}
@media(prefers-reduced-motion:reduce){.logo-mechanisms{display:none}}

</style>
</head>
<body>
<div class="app">

const workshopHaptics=(()=>{
 const supported=typeof navigator!=='undefined'&&typeof navigator.vibrate==='function';
 let enabled=true,nextPulse=0;
 try{enabled=localStorage.getItem('machinekitchen:haptics')!=='off';}catch{}
 const patterns={coin:[12,35,18],buy:[20,45,35],place:[30,20,12],belt:9,rotate:7};
 function stop(){if(supported)try{navigator.vibrate(0);}catch{}nextPulse=0;}
 function play(kind){
  if(!supported||!enabled||!domReady||typeof document==='undefined'||document.hidden)return;
  if(navigator.userActivation&&!navigator.userActivation.hasBeenActive)return;
  const pattern=patterns[kind];if(pattern===undefined)return;
  const now=Date.now();if(now<nextPulse)return;
  try{
   const accepted=navigator.vibrate(pattern);
   if(accepted!==false)nextPulse=now+(kind==='coin'?250:Array.isArray(pattern)?pattern.reduce((a,b)=>a+b,0)+35:65);
  }catch{/* Haptics must never interrupt the game. */}
 }

/* ============================================================
   simulation
   ============================================================ */
function transform(type,food){
  if(lv===7&&type==='blender'&&food==='tomato')return 'salsa';
  const r=RECIPES[type];
  if(!r) return food;
  return r[food]!==undefined ? r[food] : food;
}
function pairOut(buf){
  const k=[...buf].sort().join('+');
  return PAIRS[k]||'burnt';
}
function score(food){
  if(food===LEVELS[lv].goal){ made++; S.coins+=PAY; workshopSound.play('coin'); return 'good'; }
  spilled++; return 'bad';
}
/* place a food into the cell in front of (x,y). returns true if it left. */
function tryOutput(x,y,d,food){
  const [dx,dy]=DIRS[d], nx=x+dx, ny=y+dy;
  if(!inB(nx,ny)) return false;
  const nt=at(nx,ny);
  if(!nt) return false;
  if(nt.t==='tray'){ const r=score(food); flash(nx,ny,r,food); return true; }
  if(nt.t==='source') return false;
  if(isAssembler(nt.t)){
    if(accepts(nt,food)){
      nt.buf.push(food);
      if(full(nt)) nt.timer=MODULES[nt.t].time;
      return true;
    }
    return false;
  }
  if(occupied(nx,ny)) return false;
  items.push({id:nextId++,x:nx,y:ny,food,timer:MODULES[nt.t].time||0,moved:true,fresh:true});
  return true;
}

function stepSim(){
  tick++;
  // 1 — machines chew
  for(const it of items){
    it.moved=false;
    if(it.timer>0){
      it.timer--;
      if(it.timer===0){
        const t=at(it.x,it.y);
        if(t) it.food=transform(t.t,it.food);
      }
    }
  }
  // 2 — everything that can move, moves (repeat so queues shuffle forward)
  let changed=true, guard=0;
  while(changed && guard++<GW*GH){
    changed=false;
    for(let i=items.length-1;i>=0;i--){
      const it=items[i];
      if(it.moved||it.timer>0) continue;
      const t=at(it.x,it.y);
      if(!t){ items.splice(i,1); spilled++; changed=true; continue; }
      const [dx,dy]=DIRS[t.d], nx=it.x+dx, ny=it.y+dy;
      const nt=inB(nx,ny)?at(nx,ny):null;
      if(!nt){ items.splice(i,1); spilled++; changed=true; continue; }   // falls off the end
      if(nt.t==='source') continue;                                      // blocked
      if(nt.t==='tray'){ const r=score(it.food); flash(nx,ny,r,it.food); items.splice(i,1); changed=true; continue; }
      if(isAssembler(nt.t)){
        if(accepts(nt,it.food)){
          nt.buf.push(it.food);
          if(full(nt)) nt.timer=MODULES[nt.t].time;
          items.splice(i,1); changed=true;
        }
        continue;
      }
      if(occupied(nx,ny)) continue;
      it.x=nx; it.y=ny; it.moved=true; it.timer=MODULES[nt.t].time||0; changed=true;
    }
  }
  // 3 — mixers combine and push out
  for(const k in grid){
    const t=grid[k];
    if(!isAssembler(t.t)) continue;
    if(t.out!==null){
      if(tryOutput(t.x,t.y,t.d,t.out)) t.out=null;
    } else if(full(t) && t.timer>0){
      t.timer--;
      if(t.timer===0){ t.out=t.t==='tacostation'?'loadedtacos':pairOut(t.buf); t.buf=[]; }
    }
  }
  // 4 — supplies feed in
  for(const s of LEVELS[lv].src){
    if(tick % s.iv === 0){
      const t=at(s.x,s.y);
      if(t) tryOutput(s.x,s.y,t.d,s.f);
    }
  }
}

/* ============================================================
   level setup
   ============================================================ */
function setupLevel(i,useSaved=true){
  helpMarks.clear();
  lv=i; grid={}; items=[]; tick=0; made=0; spilled=0; nextId=1;
  const L=LEVELS[i];
  for(const s of L.src) grid[key(s.x,s.y)]={t:'source',d:s.d??0,x:s.x,y:s.y,buf:[],out:null,timer:0};
  grid[key(L.tray.x,L.tray.y)]={t:'tray',d:0,x:L.tray.x,y:L.tray.y,buf:[],out:null,timer:0};
  const saved=useSaved?S.layouts[i]:null;
  if(saved) for(const c of saved){
    if(isLocked(at(c.x,c.y))) continue;
    grid[key(c.x,c.y)]={t:c.t,d:c.d,x:c.x,y:c.y,buf:[],out:null,timer:0};
  }
}
function saveLayout(){
  const out=[];
  for(const k in grid){ const t=grid[k]; if(!isLocked(t)) out.push({x:t.x,y:t.y,t:t.t,d:t.d}); }
  S.layouts[lv]=out; save();
}
function placeTile(x,y,type,d){
  const cur=at(x,y);
  if(isLocked(cur)) return 'locked';
  if(type===null){ delete grid[key(x,y)]; return 'erased'; }
  if(cur && cur.t===type){ cur.d=(cur.d+1)%4; return 'rotated'; }
  grid[key(x,y)]={t:type,d,x,y,buf:[],out:null,timer:0};
  return 'placed';
}

const KEY='machinekitchen:save';
async function save(){
  try{ localStorage.setItem(KEY,JSON.stringify(S)); return; }catch(e){}
  try{ await window.storage.set(KEY,JSON.stringify(S)); }catch(e){}
}
async function load(){
  let raw=null;
  try{ raw=localStorage.getItem(KEY); }catch(e){}
  if(!raw){ try{ const r=await window.storage.get(KEY); if(r&&r.value) raw=r.value; }catch(e){} }
  try{
    if(raw){
      const p=JSON.parse(raw);
      const patch = p.balv!==2;
      S=Object.assign(S,p);
      if(patch){ S.coins+=180; S.balv=2; save(); pendingNote='Prices dropped and plates pay more, 180 coins added.'; }
    }
  }catch(e){}
}

const $=id=>document.getElementById(id);

function buildGrid(){
  const c=$('cells'); c.innerHTML='';
  for(let y=0;y<GH;y++) for(let x=0;x<GW;x++){
    const d=document.createElement('div');
    d.className='cell'; d.dataset.x=x; d.dataset.y=y;
    d.addEventListener('click',()=>onCell(x,y));
    c.appendChild(d);
  }
  measure();
}
function measure(){
  const board=$('board'), b=board.getBoundingClientRect();
  cellRects=[];
  const kids=[...$('cells').children];
  kids.forEach(el=>{
    const r=el.getBoundingClientRect();
    cellRects.push({x:r.left-b.left+r.width/2, y:r.top-b.top+r.height/2});
  });
  const w=kids.length?kids[0].getBoundingClientRect().width:34;
  board.style.setProperty('--fw',Math.round(w*0.74)+'px');
  board.style.setProperty('--cg',Math.max(11,Math.round(w*0.46))+'px');
}
function renderGrid(){
  if(!domReady) return;
  const cells=$('cells').children;
  for(let y=0;y<GH;y++) for(let x=0;x<GW;x++){
    const el=cells[y*GW+x], t=at(x,y);
    el.className='cell';
    if(!t){ el.innerHTML=''; continue; }
    const M=MODULES[t.t];
    if(t.t==='belt') el.classList.add('belt');
    else if(isLocked(t)) el.classList.add('locked');
    else el.classList.add('filled');
    let inner='';
    if(t.t==='belt'){
      inner=`<span class="glyph" style="color:#7d93a6;transform:rotate(${t.d*90}deg)">➤</span>`;
    } else {
      inner=artHTML(t.t,true);
      if(t.t!=='tray') inner+=arrowBadge(t.d);
    }
    if(t.t==='source'){
      const f=LEVELS[lv].src.find(s=>s.x===x&&s.y===y);
      if(f) inner=artHTML(f.f)+arrowBadge(t.d);
    }
    if(isAssembler(t.t)&&(t.buf.length||t.out)){
      inner+=`<span class="buf">${'<i></i>'.repeat(t.out?(t.t==='tacostation'?6:2):t.buf.length)}</span>`;
    }
    if(t.timer>0 || items.some(i=>i.x===x&&i.y===y&&i.timer>0)) el.classList.add('hot');
    el.innerHTML=inner;
    if(helpMarks.has(key(x,y)))el.classList.add('helpmark');
  }
}
function arrowBadge(d){
  const style=['top:50%;left:92%;transform:translate(-50%,-50%)',
               'top:92%;left:50%;transform:translate(-50%,-50%)',
               'top:50%;left:8%;transform:translate(-50%,-50%)',
               'top:8%;left:50%;transform:translate(-50%,-50%)'][d];
  return `<span class="arw" style="${style}">${ARROW[d]}</span>`;
}
function renderItems(){
  if(!domReady) return;
  const layer=$('itemlayer');
  const seen=new Set();
  for(const it of items){
    seen.add(it.id);
    let el=layer.querySelector('[data-i="'+it.id+'"]');
    const p=cellRects[it.y*GW+it.x]||{x:0,y:0};
    if(!el){
      el=document.createElement('div');
      el.className='food'; el.dataset.i=it.id;

function flash(x,y,kind,food){

function renderHUD(){

function renderParts(){

/* ============================================================
   interaction
   ============================================================ */
function onCell(x,y){
  if(inspecting){const t=at(x,y);if(t)inspectMachine(t.t,x,y);else toast("Välj en maskin eller leveransruta att inspektera.");return;}
  if(running){ toast('Pause the line before rebuilding.'); return; }
  helpMarks.clear();
  const r=placeTile(x,y,tool,dir);
  if(r==='locked'){ toast('That part is bolted down.'); return; }
  if(r==='placed')workshopSound.play(tool==='belt'?'belt':'place');
  else if(r==='rotated')workshopSound.play('rotate');
  saveLayout(); renderGrid();
}
function loop(){
  stepSim();
  renderGrid(); renderItems(); renderHUD();
  if(made>=LEVELS[lv].need && !farming){ finish(); return; }
  timer=setTimeout(loop,520/speed);
}
function setRun(on){
  running=on;
  if(on)void workshopSound.unlock();workshopSound.motorState();
  document.documentElement.style.setProperty('--tick',(520/speed)+'ms');
  clearTimeout(timer);
  if(on) timer=setTimeout(loop,120);
  renderHUD();
}
function finish(){
  clearTimeout(timer); running=false; workshopSound.motorState();
  const L=LEVELS[lv];

  S.coins+=bonus; S.done[lv]=1; save(); workshopSound.play('coin');
  renderHUD();
  const next=lv+1<LEVELS.length;
  openSheet(`
    <div class="win">
      <div class="eyebrow" style="text-align:center">Order complete</div>

      <div style="display:flex;gap:8px">
        ${next?'<button class="btn go" id="wNext">Next order</button>':''}

      <button class="btn stop" id="wShop" style="width:100%;margin-top:8px">Buy parts</button>
    </div>`);
  if(next) $('wNext').onclick=()=>{ closeSheet(); go(lv+1); };
  $('wStay').onclick=()=>{ closeSheet(); farming=true; setRun(true); };
  $('wShop').onclick=()=>{ closeSheet(); openShop(); };
}
function go(i){
  clearTimeout(timer); running=false; farming=false;

  renderGrid(); renderItems(); renderHUD();
  toast(LEVELS[i].tip);
}

function diagnose(){
 const messages=[],marks=new Set(),missing=requiredParts().filter(t=>!Object.values(grid).some(c=>c.t===t));
 for(const t of missing)messages.push('Saknas i bygget: '+MODULES[t].n+(!S.owned[t]?' (köp under Parts).':'.'));
 const incoming=new Map();
 for(const source of LEVELS[lv].src){
  let x=source.x,y=source.y,food=source.f;const visited=new Set();
  for(let n=0;n<GW*GH;n++){
   const cell=at(x,y);if(!cell)break;
   const k=key(x,y);if(visited.has(k)){marks.add(k);messages.push('Ett transportband går i en slinga vid kolumn '+(x+1)+', rad '+(y+1)+'.');break;}visited.add(k);
   if(isAssembler(cell.t)){
    const feeds=incoming.get(k)||[];feeds.push(food);incoming.set(k,feeds);break;
   }
   if(cell.t==='tray'){if(food!==LEVELS[lv].goal){marks.add(k);messages.push(FOOD[food].n+' når fatet, men beställningen kräver '+FOOD[LEVELS[lv].goal].n+'.');}break;}
   if(cell.t!=='source')food=transform(cell.t,food);
   const [dx,dy]=DIRS[cell.d],nx=x+dx,ny=y+dy;
   if(!inB(nx,ny)||!at(nx,ny)||at(nx,ny).t==='source'){marks.add(k);messages.push('Kontrollera utgången vid kolumn '+(x+1)+', rad '+(y+1)+': maten saknar en väg vidare.');break;}
   x=nx;y=ny;
  }
 }
 for(const [k,foods] of incoming){
 if(grid[k].t==='tacostation'){const missing=TACO_FILLINGS.filter(f=>!foods.includes(f));if(missing.length){marks.add(k);messages.push('Taco Station saknar en väg för: '+missing.map(f=>FOOD[f].n).join(', ')+'.');}continue;}

 for(const start of Object.values(grid).filter(c=>isAssembler(c.t))){
  let cell=start;const visited=new Set();
  while(cell&&cell.t!=='tray'){
   const k=key(cell.x,cell.y);
   if(visited.has(k)){marks.add(k);messages.push('Vägen efter Mixer går i en slinga vid kolumn '+(cell.x+1)+', rad '+(cell.y+1)+'.');break;}
   visited.add(k);const [dx,dy]=DIRS[cell.d],next=at(cell.x+dx,cell.y+dy);
   if(!next||next.t==='source'){marks.add(k);messages.push('Vägen efter Mixer tar stopp vid kolumn '+(cell.x+1)+', rad '+(cell.y+1)+'. Vrid utgången eller bygg vidare till fatet.');break;}
   cell=next;
  }
 }
 const trial=trialRun();
 if(trial.served>=Math.max(1,LEVELS[lv].need-made))messages.unshift('Bygget kan klara beställningen! Testkörningen gav '+trial.served+' rätta portioner.'+(trial.wasted?' Några felaktiga portioner kom också fram eller tappades.':''));
 else if(!missing.length&&!messages.length)messages.push('Testkörningen gav bara '+trial.served+' rätta portioner. Kontrollera vägen efter mixern, stopp i flödet och om mixern får två likadana ingredienser i följd. Gamla ingredienser kan finnas kvar i maskinerna.');
 helpMarks=marks;renderGrid();return [...new Set(messages)];
}

function strokeStep(p){
 const st=beltStroke;if(!st||st.ended)return;
 const prev=st.last,dx=p.x-prev.x,dy=p.y-prev.y;
 if(!dx&&!dy)return;
 const d=dx>0?0:dy>0?1:dx<0?2:3;
 const target=at(p.x,p.y),from=at(prev.x,prev.y);
 if(target&&target.t==='source'){st.ended=true;return;}
 if(from&&from.t==='belt')from.d=d;
 if(!target||target.t==='belt'){
   grid[key(p.x,p.y)]={t:'belt',d,x:p.x,y:p.y,buf:[],out:null,timer:0};
 }else st.ended=true;
 st.last=p;st.changed=true;
}
function extendStroke(p){
 const st=beltStroke;if(!st||st.ended)return;
 // Fill skipped pointer samples with a continuous, orthogonal path.
 while(st.last.x!==p.x&&!st.ended)strokeStep({x:st.last.x+Math.sign(p.x-st.last.x),y:st.last.y});
 while(st.last.y!==p.y&&!st.ended)strokeStep({x:st.last.x,y:st.last.y+Math.sign(p.y-st.last.y)});
 renderGrid();
}

 }

 cells.addEventListener('pointerdown',e=>{

   beltStroke={id:e.pointerId,start:p,last:p,snapshot:JSON.stringify(grid),moved:false,changed:false,ended:false,px:e.clientX,py:e.clientY};

 });

  document.addEventListener('pointerdown',()=>{void workshopSound.unlock();},{passive:true});
  document.addEventListener('keydown',()=>{void workshopSound.unlock();});
  document.addEventListener('visibilitychange',()=>{workshopSound.visibility();if(document.hidden)workshopHaptics.stop();});
  $('btnHelp').onclick=()=>openHelp();
  $('btnShop').onclick=openShop;
  $('btnLevels').onclick=openLevels;
  $('scrim').onclick=e=>{ if(e.target===$('scrim')) closeSheet(); };
  document.addEventListener('keydown',e=>{
    if(e.key==='r'||e.key==='R') setDir((dir+1)%4);
    if(e.key===' '&&!e.target.closest('button,input,select,textarea,[role="button"]')&&!$('scrim').classList.contains('open')){ e.preventDefault(); setRun(!running); }
  });
  $('dirs').querySelectorAll('.dir').forEach(b=>b.onclick=()=>setDir(+b.dataset.d));
  window.addEventListener('resize',()=>{ measure(); renderItems(); });

  if(!S.seen) openIntro(); else toast(pendingNote||LEVELS[lv].tip);
}
function setDir(d){
  dir=d;
  $('dirs').querySelectorAll('.dir').forEach(b=>b.classList.toggle('on',+b.dataset.d===d));
}
if(typeof document!=='undefined') document.addEventListener('DOMContentLoaded',init);
globalThis.KM={setupLevel,placeTile,stepSim,state:()=>({items,made,spilled,tick,grid}),LEVELS};
</script>
